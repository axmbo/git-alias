name: Enforce exclusive scoped labels

on:
  issues:
    types: [labeled]

# Nega tudo por padrão; o job pede só o que usa (mesmo padrão de
# security.yml / ci.yml).
permissions: {}

jobs:
  enforce-exclusive:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // "scoped labels" estilo GitLab: "grupo::valor" (dois ":") é
            // exclusiva — uma issue só carrega uma do mesmo "grupo::" por
            // vez. Um ":" só, "grupo::" de valor vazio e label solta não
            // são exclusivos.
            //
            // Este workflow faz só isso: ao aplicar "grupo::valor"
            // bem-formado, remove as demais "grupo::*" DESSA issue. Não
            // reescreve, não cria label, não normaliza caixa. É best-effort
            // (sem serialização entre execuções). Contexto e limites: ver
            // docs/adr/0005.

            const newLabel = context.payload.label.name;
            const { owner, repo } = context.repo;
            const { number: issue_number } = context.payload.issue;

            // Bem-formado: algo dos dois lados do 1º "::" ("a::b::c" ->
            // grupo "a"). Senão — um ":" só, "grupo::", "::valor", label
            // solta — não há o que fazer.
            const m = newLabel.match(/^([^:]+)::.+/);
            if (!m) return;
            const groupPrefix = `${m[1]}::`;

            // Fonte da verdade: as labels ATUAIS da issue, não o snapshot
            // do webhook. 1 retry cobre o lag de replicação logo após o
            // evento; se mesmo assim a label do gatilho não está lá, o
            // usuário a desfez — nada a fazer.
            let names = await currentLabelNames();
            if (!names.includes(newLabel)) {
              await new Promise((r) => setTimeout(r, 1500));
              names = await currentLabelNames();
              if (!names.includes(newLabel)) return;
            }

            for (const name of names) {
              if (name.startsWith(groupPrefix) && name !== newLabel) {
                await removeLabelIfPresent(name);
              }
            }

            async function currentLabelNames() {
              const current = await github.paginate(
                github.rest.issues.listLabelsOnIssue,
                { owner, repo, issue_number, per_page: 100 },
              );
              return current.map((l) => l.name);
            }

            // Corrida com outra execução pode remover a label antes de
            // nós; 404 aqui só significa "já não está na issue".
            async function removeLabelIfPresent(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }
